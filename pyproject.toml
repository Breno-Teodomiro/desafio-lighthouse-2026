[project]
name = "lh-nautical"
version = "1.0.0"
description = "Desafio Lighthouse 2026 (Indicium) — pipeline de dados, análises e BI da LH Nautical"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Breno Teodomiro", email = "insights.jobs.ia@gmail.com" }]

dependencies = [
    "psycopg[binary]>=3.2",
    "pandas>=2.2",
    "numpy>=2.0",
    "pyarrow>=17.0",
    "scikit-learn>=1.5",
    "plotly>=6.0",
    "matplotlib>=3.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "jupyter>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lh_nautical"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
